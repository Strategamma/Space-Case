name: Release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: space_case_test
          POSTGRES_USER: space_case
          POSTGRES_PASSWORD: local_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U space_case -d space_case_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://space_case:local_test_only@localhost:5432/space_case_test
      - run: npm audit --omit=dev --audit-level=high
