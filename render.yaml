services:
  - type: web
    name: space-case
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: space-case-db
          property: connectionString
databases:
  - name: space-case-db
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: space_case
    user: space_case
    ipAllowList: []
